<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" width="240" height="64">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#CF9D7B"/>
      <stop offset="100%" style="stop-color:#724B39"/>
    </linearGradient>
  </defs>

  <!-- Badge carré arrondi avec gradient -->
  <rect x="0" y="4" width="56" height="56" rx="14" fill="url(#grad1)"/>

  <!-- Lettre S stylisée -->
  <text x="28" y="42" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" fill="white" text-anchor="middle">S</text>

  <!-- Nom SINOKO -->
  <text x="74" y="32" font-family="'Arial', sans-serif" font-size="22" font-weight="800" fill="#CF9D7B" letter-spacing="3">SINOKO</text>

  <!-- Ligne de séparation fine -->
  <line x1="74" y1="37" x2="234" y2="37" stroke="#724B39" stroke-width="1" opacity="0.5"/>

  <!-- Sous-titre -->
  <text x="74" y="50" font-family="'Arial', sans-serif" font-size="9" font-weight="400" fill="#CF9D7B" letter-spacing="4" opacity="0.65">GESTION DE MAINTENANCE</text>
</svg>