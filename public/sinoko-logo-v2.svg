<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" width="240" height="64">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#CF9D7B"/>
      <stop offset="100%" style="stop-color:#724B39"/>
    </linearGradient>
  </defs>

  <!-- Hexagone -->
  <polygon points="28,4 52,18 52,46 28,60 4,46 4,18" fill="url(#grad2)"/>

  <!-- Clé à molette blanche à l'intérieur du hexagone -->
  <g transform="translate(28,32)" fill="white">
    <!-- Corps de la clé -->
    <rect x="-2" y="-13" width="4" height="20" rx="2"/>
    <!-- Tête de la clé -->
    <circle cx="0" cy="-13" r="5" fill="none" stroke="white" stroke-width="2.5"/>
    <circle cx="0" cy="-13" r="2" fill="white"/>
    <!-- Extrémité -->
    <rect x="-4" y="7" width="8" height="5" rx="2"/>
  </g>

  <!-- Nom SINOKO en gras -->
  <text x="68" y="29" font-family="'Arial Black', 'Arial', sans-serif" font-size="20" font-weight="900" fill="#F2F0EE" letter-spacing="4">SINOKO</text>

  <!-- Point accent coloré -->
  <circle cx="68" cy="43" r="3" fill="#CF9D7B"/>
  <!-- Sous-titre à côté du point -->
  <text x="78" y="47" font-family="'Arial', sans-serif" font-size="9" fill="#CF9D7B" letter-spacing="3" opacity="0.7">MAINTENANCE SAAS</text>
</svg>